name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore application
        run: dotnet restore SmartUsbBackup.WinUI.csproj

      - name: Restore tests
        run: dotnet restore SmartUsbBackup.Tests/SmartUsbBackup.Tests.csproj

      - name: Build application
        run: dotnet build SmartUsbBackup.WinUI.csproj -c Release --no-restore -p:Platform=x64

      - name: Build tests
        run: dotnet build SmartUsbBackup.Tests/SmartUsbBackup.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test SmartUsbBackup.Tests/SmartUsbBackup.Tests.csproj -c Release --no-build